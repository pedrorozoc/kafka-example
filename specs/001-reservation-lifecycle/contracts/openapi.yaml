openapi: 3.1.0
info:
  title: Reservas de bistro
  version: 1.0.0
security: []
paths:
  /api/v1/reservations:
    post:
      operationId: createReservation
      summary: Solicitar una mesa para una fecha y hora de llegada
      description: >-
        Una mesa con capacidad suficiente está disponible cuando carece de una reserva
        confirmada para la misma fecha y minuto local del restaurante.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservation' }
      responses:
        '201':
          description: Reserva creada con decisión definitiva
          headers:
            Location:
              required: true
              description: Ruta para consultar la reserva por su código
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedReservation' }
              examples:
                confirmed:
                  summary: Una mesa libre tiene capacidad suficiente
                  value: { reservationCode: '815c306e-0ff9-4f34-8050-ed972d1ffcf5', status: CONFIRMED }
                rejected:
                  summary: Ninguna mesa apta está disponible
                  value: { reservationCode: 'c64a2ba1-62dc-4ec3-aba6-f8e49dbad84b', status: REJECTED }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/SystemError'
  /api/v1/reservations/{reservationCode}:
    get:
      operationId: getReservationStatus
      summary: Consultar el estado por código público
      parameters:
        - name: reservationCode
          in: path
          required: true
          description: Código recibido al crear la reserva. Un código desconocido, incluido texto que no representa un UUID, devuelve 404.
          schema: { type: string }
      responses:
        '200':
          description: Estado definitivo de la reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationStatus' }
        '404':
          description: Reserva no encontrada
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Reserva no encontrada, status: 404, detail: No existe una reserva con ese código. }
        '500':
          $ref: '#/components/responses/SystemError'
components:
  schemas:
    CreateReservation:
      type: object
      required: [customerName, customerEmail, reservationTime, partySize]
      properties:
        customerName: { type: string, minLength: 1, pattern: '\S', example: Ana Pérez }
        customerEmail: { type: string, format: email, example: ana@example.org }
        reservationTime:
          type: string
          minLength: 16
          maxLength: 16
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: >-
            Fecha de calendario válida y hora local del restaurante en formato
            YYYY-MM-DDTHH:mm, sin segundos, fracciones ni zona horaria.
          example: '2030-06-12T19:00'
        partySize:
          type: integer
          minimum: 1
          maximum: 12
          description: >-
            Cantidad de comensales entre 1 y 12 inclusive. Se aceptan números JSON
            de valor entero, como 12.0. Una cantidad inválida produce 400 antes
            de crear la reserva o consultar disponibilidad.
          example: 4
    FinalStatus:
      type: string
      enum: [CONFIRMED, REJECTED]
    CreatedReservation:
      type: object
      required: [reservationCode, status]
      additionalProperties: false
      properties:
        reservationCode: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/FinalStatus' }
    ReservationStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/FinalStatus' }
    Problem:
      type: object
      required: [title, detail, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, description: Título del error en español }
        detail: { type: string, description: Explicación del error en español }
        status: { type: integer }
        instance: { type: string, format: uri-reference }
  responses:
    InvalidRequest:
      description: Datos inválidos o JSON ilegible
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            invalidReservationTime:
              value: { title: Solicitud inválida, status: 400, detail: Se requiere un cuerpo JSON válido con los tipos y formatos esperados. }
            nonpositivePartySize:
              value: { title: Solicitud inválida, status: 400, detail: La cantidad de comensales debe ser un entero positivo. }
            partySizeAboveMaximum:
              value: { title: Solicitud inválida, status: 400, detail: La cantidad de comensales no puede superar las 12 personas. }
    SystemError:
      description: Fallo técnico durante la operación
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { title: Error del sistema, status: 500, detail: No se pudo completar la operación. }
